[project]
name = "fastapi-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "openai>=3.0.0",
    "psycopg-pool>=3.3.1",
    "psycopg[binary]>=3.3.4",
    "sentence-transformers>=5.7.0",
    "torch>=2.13.0",
    "tqdm>=4.67.3",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "ruff>=0.16.2",
]

[project.scripts]
python = "python:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.pyright]
typeCheckingMode = "standard"  # basic/standard/strict から選択
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
exclude = [".venv", "**/__pycache__"]

[tool.uv]
package = false

# GPUを搭載しないEC2上でCPU推論のみを行うため、torchはCPU専用ビルドに固定する。
# 既定のPyPIインデックスから解決するとCUDA版(nvidia-*, tritonを含む)が入り、
# 不要に数GBを消費した上でこのマシンでは使われない。
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
